<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Receitas</title>
</head>
<body class="bg-warning" onload="preencheCatalogo()">
    <div class="container-fluid">
        <h1 class="text-center my-4">Catálogo de Receitas</h1>
        <div id="pnlCatalogo" class="d-flex flex-wrap justify-content-around"></div>
    </div>
    
    <script>
        const receitas = [
            {
                titulo: "Bolo de Cenoura",
                imagem: "bolo_cenoura.png",
                preparo: "Misture os ingredientes, asse em forno médio por 40 minutos e cubra com calda de chocolate.",
                ingredientes: ["Cenouras", "Farinha de Trigo", "Açúcar", "Ovos", "Óleo", "Fermento"]
            },
            {
                titulo: "Salada Colorida",
                imagem: "salada.png",
                preparo: "Lave e pique os vegetais. Misture tudo em uma tigela grande e tempere a gosto. Sirva gelado.",
                ingredientes: ["Alface Americana", "Tomate Cereja", "Pepino", "Queijo Feta", "Azeite", "Sal", "Pimenta"]
            },
            {
                titulo: "Feijoada Completa",
                imagem: "feijoada.png",
                preparo: "Deixe o feijão de molho. Cozinhe com as carnes salgadas. Sirva com arroz, couve e laranja.",
                ingredientes: ["Feijão Preto", "Carne Seca", "Paio", "Costelinha Salgada", "Alho", "Cebola"]
            }
        ];

        function getListaIngredientes(receita) {
            let listaHTML = '<ul>';
            const itensLista = receita.ingredientes.map(ingrediente => `<li>${ingrediente}</li>`);
            listaHTML += itensLista.reduce((acc, item) => acc + item, '');
            listaHTML += '</ul>';
            return listaHTML;
        }
      
        function getCard(receita) {
            return `
                <div class="card m-3" style="width: 20rem;">
                    <img src="${receita.imagem}" class="card-img-top" alt="Imagem de ${receita.titulo}">
                    <div class="card-body">
                        <h5 class="card-title">${receita.titulo}</h5>
                        <div class="card-text">
                            <h6>Ingredientes:</h6>
                            ${getListaIngredientes(receita)} <hr> <h6>Modo de Preparo:</h6>
                            <p>${receita.preparo}</p> </div>
                    </div>
                </div>
            `;
        }
      
        function preencheCatalogo() {
            const pnlCatalogo = document.getElementById('pnlCatalogo');
            const cardsHTML = receitas
                .map(receita => getCard(receita))
                .reduce((acumulador, card) => acumulador + card, '');
            pnlCatalogo.innerHTML = cardsHTML;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
